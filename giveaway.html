<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participation</title>
</head>
<body>
    <form action="#" method="post">
    <h2>Fill out your information.</h2>
    <hr>
    <p>Fill out your login information to be eligible for the giveaway.</p>

    <label for="username">Username:</label>
    <input type="text" placeholder="Enter Username" id="username" name="username"><br><br>

    <label for="email">Email:</label>
    <input type="email" placeholder="Enter Email" id="email" name="email"><br><br>

    <label for="password">Password:</label>
    <input type="password" placeholder="Enter Password" id="password" name="password" required><br><br>

    <label for="date">Date of Birth:</label>
    <input type="date" id="date" name="date"><br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" placeholder="Enter Phone Number" id="phone" name="phone"><br><br>

    <input type="submit" value="Send">
    </form>
    
    

    <P>Click the link down below to see the method we're going to use to determine the winner, as well as the date when the lucky ones will be announced.</P>

    <a href="winner.html" target="_blank">Visit the Announcement Page</a>
